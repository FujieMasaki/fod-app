# Solid Queueのworker（TASK-003で採用。並列数・DB poolの実値はTASK-009の実測で見直す）。
# DBの接続数（database.ymlのmax_connections。RAILS_MAX_THREADSに連動）は、workerのthreadsに2（pollingとheartbeat）を
# 足した数以上が要る。足りないとJobが接続を待って失敗するので、threadsは接続数から導く（既定の5なら3）。
# threadsを最低1へ切り上げると接続数を超えるので、RAILS_MAX_THREADSが整数でないか3未満なら起動を止める。
<%
  max_threads = Integer(ENV.fetch("RAILS_MAX_THREADS", "5"), 10, exception: false)
  if max_threads.nil? || max_threads < 3
    raise ArgumentError, "RAILS_MAX_THREADS must be an integer of 3 or more for the Solid Queue worker " \
                         "(threads + 2 must fit in max_connections): #{ENV["RAILS_MAX_THREADS"].inspect}"
  end
%>
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: <%= max_threads - 2 %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
