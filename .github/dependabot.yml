version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        # scripts/vrt.shのイメージ（pinned_version・digest）と一緒に上げる必要があるため、単独のPRにする。
        exclude-patterns: ["@playwright/test"]
        update-types: ["minor", "patch"]
  # apps/apiのGemfileに直接書いたgemの定期の更新。間接依存の勧告は、リポジトリの設定で有効にしたsecurity updatesが受け持つ。
  - package-ecosystem: bundler
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        # Railsの更新は、内部に依存する箇所（docs/code-review/backend/security.md §6）の確認が要るため、単独のPRにする。
        exclude-patterns: ["rails"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
