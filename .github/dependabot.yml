version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        # scripts/vrt.shのイメージ（pinned_version・digest）と一緒に上げる必要があるため、単独のPRにする。
        exclude-patterns: ["@playwright/test"]
        update-types: ["minor", "patch"]
  # apps/apiのgemも更新のPRを受け取る（bundler-auditの勧告への追従を手作業だけにしないため）。
  - package-ecosystem: bundler
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        # Railsの更新は既定値や非公開APIの差し替え（config/initializers/json_request_body.rb）の確認が要るため、単独のPRにする。
        exclude-patterns: ["rails", "railties", "action*", "active*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
