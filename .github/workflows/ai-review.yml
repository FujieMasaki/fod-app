name: AI Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    # Only the repository owner's same-repository PRs can consume the API budget.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target runs trusted base-branch code. Never run PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Review PR diff
        id: review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ai-review.mjs
      - name: Report review failure
        if: steps.review.outcome == 'failure'
        run: |
          echo '::warning::AI review did not complete. Check the previous step. Normal CI is unaffected.'
          echo 'AI review did not complete. Check the review step logs; normal CI is unaffected.' >> "$GITHUB_STEP_SUMMARY"
