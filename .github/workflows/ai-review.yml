name: AI Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    # Always execute the trusted default-branch implementation, never PR code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Review PR diff
        id: review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/ai-review.mjs
      - name: Report review failure
        if: steps.review.outcome == 'failure'
        run: |
          echo '::warning::AI review did not complete. Check the previous step. Normal CI is unaffected.'
          echo 'AI review did not complete. Check the review step logs; normal CI is unaffected.' >> "$GITHUB_STEP_SUMMARY"
