pre-commit:
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: pnpm exec eslint -- {staged_files}
    naming:
      glob: "apps/web/src/**/*.{ts,tsx,css}"
      run: pnpm lint:naming
    markdown:
      glob: "*.md"
      run: pnpm lint:markdown

pre-push:
  parallel: true
  commands:
    types:
      run: pnpm type-check
    tests:
      run: pnpm test
