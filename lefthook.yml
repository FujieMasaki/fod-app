pre-commit:
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: pnpm exec eslint -- {staged_files}
    naming:
      glob: "src/**/*.{ts,tsx,css}"
      run: pnpm lint:naming

pre-push:
  parallel: true
  commands:
    types:
      run: pnpm type-check
    tests:
      run: pnpm test
